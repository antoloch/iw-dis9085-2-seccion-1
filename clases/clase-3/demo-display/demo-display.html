<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo display · Portada</title>
  <link rel="stylesheet" href="demo-display.css">
</head>
<body>

  <section class="portada">

    <!-- INLINE-BLOCK: una etiqueta pequeña con padding -->
    <p><span class="etiqueta">Estudio de diseño · Santiago</span></p>

    <!-- BLOCK: el título ocupa todo el ancho y empieza en línea nueva -->
    <h1>Diseñamos objetos, textiles y piezas gráficas</h1>

    <!-- BLOCK con INLINE adentro: strong y a fluyen dentro del texto -->
    <p class="bajada">
      Somos un estudio <strong>multidisciplinario</strong> que trabaja con
      materiales locales. Revisa <a href="#proyectos">nuestros proyectos</a>
      o escríbenos para empezar uno nuevo.
    </p>

    <!-- INLINE-BLOCK: un enlace con aspecto de botón -->
    <a href="#contacto" class="boton">Conversemos</a>

    <!-- IMAGEN CHICA: más pequeña que su caja (320 x 213 px) -->
    <img src="img/pequena.jpg" alt="Tela de lino verde con pliegues, vista de cerca" class="portada-imagen">

  </section>


</body>
</html>
